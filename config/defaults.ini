[endlesskey]
collections_add =
  spanish
  spanish-extras

# FZT - OLPC - UNDINA
[flatpak-remote-fzt]
repo_file = https://undina.olpc.global/flatpak/undina.flatpakrepo
apps_add =
  org.fundacionzt.undina
