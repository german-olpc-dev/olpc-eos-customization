  net.ankiweb.Anki
  org.gnome.gbrainy
  org.kde.kalgebra
  org.kde.kblocks
  org.kde.kbruch
  org.kde.kgeography
  org.kde.khangman
  org.kde.kstars
  org.learningequality.Kolibri
  org.moneymanagerex.MMEX
  org.qgis.qgis
  org.stellarium.Stellarium
  org.sugarlabs.TypingTurtle
  # FZT
  org.sugarlabs.StoryActivity
  org.pencil2d.Pencil2D
